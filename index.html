
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Celebration</title>

  <style>
    * {
      box-sizing: border-box;
    }
   html {
  scroll-behavior: smooth;
}
    body {
        margin: 0;
  overflow-x: hidden;
  overflow-y: auto;
  min-height: 100vh;

  font-family: "Poppins", sans-serif;
  background: radial-gradient(circle at bottom, #0d0221, #1a0033);

  text-align: center;
  color: white;
    }

    
    .content {
      position: relative;
      z-index: 5;
      padding: 20px;
    }

    h1 {
      font-size: clamp(40px, 7vw, 70px);
      margin-top: 80px;
      margin-bottom: 20px;
      color: #ffdd33;
      text-shadow:
        0 0 25px #ff6600,
        0 0 50px #ff3300;
    }

    #birthdayBtn {
      padding: 15px 40px;
      font-size: clamp(16px, 2.5vw, 22px);
      border: none;
      border-radius: 30px;
      background: linear-gradient(45deg, #ff0066, #ffcc00);
      color: white;
      cursor: pointer;
      box-shadow: 0 0 25px #ffcc00;
      margin-top: 10px;
      transition: transform 0.3s;
    }

    #birthdayBtn:hover {
      transform: scale(1.1);
    }

    #cake {
      font-size: clamp(90px, 15vw, 150px);
      margin-top: 40px;
      transition: transform 1s, text-shadow 1s;
    }

    .flame {
      position: relative;
      top: -100px;
      font-size: clamp(20px, 4vw, 30px);
      animation: flicker 0.3s infinite alternate;
    }

    @keyframes flicker {
      from {
        transform: scale(1);
        opacity: 1;
      }

      to {
        transform: scale(1.2);
        opacity: 0.7;
      }
    }

    #wishes {
      font-size: clamp(20px, 4vw, 32px);
      color: #ffdd33;
      text-shadow: 0 0 20px #ff6600;
      display: none;
      margin: 30px auto 0;
      max-width: 900px;
      padding: 0 20px;
    }

  
    .balloon {
      position: fixed;
      bottom: -100px;
      z-index: 2;
      pointer-events: none;
      animation-name: floatup;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
    }

    @keyframes floatup {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      50% {
        transform: translateY(-50vh) rotate(10deg);
      }

      100% {
        transform: translateY(-120vh) rotate(360deg);
        opacity: 0;
      }
    }

    
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }


    @media (max-width: 600px) {
      .content {
        padding: 15px;
      }

      h1 {
        margin-top: 60px;
      }

      #birthdayBtn {
        padding: 12px 25px;
      }

      #cake {
        margin-top: 30px;
      }

      .flame {
        top: -70px;
      }

      #wishes {
        margin-top: 20px;
      }
    }

    .birthday-images { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 25px; 
      margin-top: 30px; 
      flex-wrap: wrap; } 
      .birthday-images h2 { margin: 0; 
        color: white; font-size: 24px; } 
        .birthday-img { width: 150px; 
        height: 150px; /* Circle */ 
        border-radius: 50%; /* Image properly fit */
         object-fit: cover; /* Border */
          border: 4px solid white; /* Shadow */
           box-shadow: 0 0 20px rgba(0, 198, 255, 0.7); /* Prevent image shrinking */ flex-shrink: 0; } /* Mobile Responsive */ @media (max-width: 600px) { 
            .birthday-img { width: 120px; height: 120px; }
             .birthday-images { gap: 15px; } 
             .birthday-images h2
              { width: 100%; text-align: center; font-size: 20px; } }
  </style>
</head>

<body>

  <div class="content">

    <h1 id="title"
    style="
      font-size: clamp(40px, 7vw, 70px);
      background: linear-gradient(90deg, #00c6ff, #7b2ff7, #f72585);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(0, 198, 255, 0.5);
      margin-top: 80px;
    ">
  Happy Birthday Anuj 🎉
</h1>
    <button id="birthdayBtn">
      Click to Celebrate 🎊
    </button>

   
  
<button 
id="playBtn" onclick="playAudio()" 
style=" margin: 20px 30px; padding: 14px 28px; border: none; border-radius: 30px; background: linear-gradient(135deg, #ff0080, #7928ca, #00c6ff); 
color: white; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 0 15px rgba(255, 0, 128, 0.6); " >
 🔊 Play Song </button>


<audio id="audioPlayer" preload="auto">
  <source src="birthday.mp4" type="audio/mpeg">
</audio>
     
    <div class="birthday-images"> <img class="birthday-img" src="anuj.jpeg" alt="Anuj" /> <h2>17 September</h2> <img class="birthday-img" src="vikaram.jpeg" alt="Vikram" /> </div>

    <div id="cake">
      🎂
      <span class="flame">🔥</span>
    </div>

    <div id="wishes">
      Wishing You a Super Fun & Joyful Birthday 🎂🎉
    </div>

  </div>

  <canvas id="fireworks"></canvas>


  <script>

    const btn = document.getElementById("birthdayBtn");
    const cake = document.getElementById("cake");
    const wishes = document.getElementById("wishes");

    const canvas = document.getElementById("fireworks");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    resizeCanvas();

    window.addEventListener("resize", resizeCanvas);


    

    const balloonTypes = [
      "🎈",
      "🎈",
      "🎈",
      "🎈",
      "🎈",
      "🎈",
      "🎈",
      "🎈",
      "🎈"
    ];

    function createBalloon() {

      const balloon = document.createElement("div");

      balloon.className = "balloon";

      balloon.style.left =
        Math.random() * 95 + "%";
      const size =
        30 + Math.random() * 45;

      balloon.style.fontSize =
        size + "px";
      const duration =
        6 + Math.random() * 6;

      balloon.style.animationDuration =
        duration + "s";
      balloon.style.transform =
        `rotate(${Math.random() * 20 - 10}deg)`;
      balloon.textContent =
        balloonTypes[
          Math.floor(
            Math.random() * balloonTypes.length
          )
        ];

      document.body.appendChild(balloon);
      setTimeout(() => {
        balloon.remove();
      }, (duration + 1) * 1000);
    }


    function startBalloons() {
      for (let i = 0; i < 10; i++) {

        setTimeout(() => {
          createBalloon();
        }, i * 500);

      }
      const interval =
        window.innerWidth <= 600
          ? 1000
          : 650;

      setInterval(createBalloon, interval);
    }


    
    startBalloons();


    let particles = [];
    let fireworksStarted = false;


    function createExplosion(x, y) {

      for (let i = 0; i < 60; i++) {
          particles.push({
            x: x,
          y: y,

          vx:
            (Math.random() - 0.5) * 8,

          vy:
            (Math.random() - 0.5) * 8,

          life: 100,

          color:
            `hsl(${Math.random() * 360}, 100%, 60%)`,

          size:
            Math.random() * 3 + 1

        });

      }

    }


    function animate() {

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      for ( let i = particles.length - 1; i >= 0; i-- ) {

        const p = particles[i];
         p.x += p.vx;
        p.y += p.vy;

        p.vy += 0.05;

        p.life--;
       ctx.beginPath();
       ctx.arc(
          p.x,
          p.y,
          p.size,
          0,
          Math.PI * 2
        );

        ctx.fillStyle = p.color;

        ctx.fill();


        if (p.life <= 0) {

          particles.splice(i, 1);

        }

      }


      requestAnimationFrame(animate);

    }

    btn.addEventListener("click", () => {

      cake.style.transform =
        "scale(1.2)";

      cake.style.textShadow =
        "0 0 50px #ffdd33, 0 0 100px #ff6600";


      wishes.style.display =
        "block";


      btn.textContent =
        "🎉 Birthday Celebration 🎉";

      if (!fireworksStarted) {

        fireworksStarted = true;

        setInterval(() => {

          const x =
            Math.random() * canvas.width;

          const y =
            Math.random() *
            (canvas.height / 2);

          createExplosion(x, y);

        }, 600);


        animate();

      }

    });

 function playAudio() {
   const audio = document.getElementById("audioPlayer"); 
   const button = document.getElementById("playBtn");
    if (audio.paused) { 
      audio.play(); button.innerHTML = "⏸️ Pause Song"; } 
      else { 
        audio.pause(); button.innerHTML = "🔊 Play Song"; }
      
      }

  </script>

</body>
</html>
